name: Daily Shorts Pipeline

on:
  schedule:
    - cron: "0 14 * * *"  # 14:00 UTC daily; adjust to your preferred publish time
  workflow_dispatch: {}

permissions:
  contents: write

# One run at a time. Two overlapping runs would each generate a video and each
# spend real money, and both would race to commit state/history.json.
concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fonts-dejavu-core is not optional: ffmpeg's drawtext needs a real font
      # file, and without one the assembly step fails *after* the generation
      # spend has already happened.
      - name: Install ffmpeg and a caption font
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run daily pipeline
        env:
          # The package lives in src/. pytest.ini's `pythonpath = src` applies
          # to pytest only, so `python -m pipeline.orchestrator` needs this or
          # it dies with ModuleNotFoundError before doing anything at all.
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Every minute spent waiting for approval is a billed Actions minute.
          APPROVAL_TIMEOUT_SEC: "1800"
          MAX_COST_USD: "5.0"
          # Repository Variables (Settings → Secrets and variables → Actions → Variables),
          # not Secrets — not sensitive, and VALIDATION_ACK_COUNT specifically needs
          # editing by hand after every checkpoint review. Unset resolves to "" here,
          # which orchestrator.py's _env_float/_env_int treat as "use the default"
          # (125 / 10 / 0) — see docs/superpowers/specs/2026-09-01-validation-budget-guard-design.md.
          VALIDATION_BUDGET_USD: ${{ vars.VALIDATION_BUDGET_USD }}
          VALIDATION_CHECKPOINT_EVERY: ${{ vars.VALIDATION_CHECKPOINT_EVERY }}
          VALIDATION_ACK_COUNT: ${{ vars.VALIDATION_ACK_COUNT }}
        run: python -m pipeline.orchestrator

      - name: Commit updated state
        run: |
          git config user.name "shorts-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update pipeline state [skip ci]"
          git pull --rebase --autostash
          git push
